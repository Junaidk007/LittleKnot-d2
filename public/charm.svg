<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <defs>
    <!-- Thread pattern -->
    <linearGradient id="yarnThread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8A7A"/>
      <stop offset="50%" stop-color="#FF6B5E"/>
      <stop offset="100%" stop-color="#E05346"/>
    </linearGradient>
    <radialGradient id="peachGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFA296"/>
      <stop offset="60%" stop-color="#FF6B5E"/>
      <stop offset="100%" stop-color="#D9483B"/>
    </radialGradient>
    <radialGradient id="leafGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A5EACD"/>
      <stop offset="100%" stop-color="#58BA94"/>
    </radialGradient>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFAAA6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF6B5E" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#3B2A4A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Twisted Yarn String hanging down -->
  <path d="M50 0 C48 15, 52 25, 50 40 C48 55, 52 65, 50 78" 
        stroke="url(#yarnThread)" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="6,2"/>
  
  <!-- Wooden bead / Ring connector -->
  <circle cx="50" cy="78" r="5" fill="#E6C280" stroke="#C49B55" stroke-width="1.5" />

  <!-- Hanging Charm Body with filter shadow -->
  <g filter="url(#softShadow)">
    <!-- Small Leaf on top -->
    <path d="M50 80 C40 70, 32 72, 36 82 C40 90, 48 85, 50 82" fill="url(#leafGrad)" stroke="#45A07C" stroke-width="1.5" />
    <path d="M51 81 C60 72, 68 75, 63 84 C58 91, 52 85, 50 83" fill="url(#leafGrad)" stroke="#45A07C" stroke-width="1.5" />

    <!-- Cute Crocheted Strawberry / Peach Amigurumi -->
    <!-- Stitched texture outline -->
    <ellipse cx="50" cy="116" rx="34" ry="32" fill="url(#peachGrad)" />
    
    <!-- Crochet stitch texture lines (subtle hand-crochet feel) -->
    <path d="M24 112 C28 106, 38 106, 42 112 C46 118, 56 118, 60 112 C64 106, 74 106, 76 112" 
          stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M28 124 C32 120, 40 120, 45 124 C50 128, 58 128, 63 124 C68 120, 72 122, 74 125" 
          stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M34 100 C38 97, 44 97, 48 100 C52 103, 58 103, 62 100" 
          stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Cute Kawaii Face -->
    <!-- Eyes -->
    <circle cx="39" cy="113" r="3.5" fill="#3B2A4A" />
    <circle cx="40.2" cy="111.8" r="1.2" fill="#FFFFFF" />
    <circle cx="61" cy="113" r="3.5" fill="#3B2A4A" />
    <circle cx="62.2" cy="111.8" r="1.2" fill="#FFFFFF" />

    <!-- Pink Blushes -->
    <circle cx="33" cy="119" r="5" fill="url(#blushGrad)" />
    <circle cx="67" cy="119" r="5" fill="url(#blushGrad)" />

    <!-- Sweet Smiling Mouth -->
    <path d="M47 118 Q50 123 53 118" stroke="#3B2A4A" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Little Bell / Tassel at bottom -->
    <circle cx="50" cy="148" r="3" fill="#FFC94A" />
    <path d="M47 149 L43 158 M50 151 L50 160 M53 149 L57 158" stroke="#FFC94A" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
